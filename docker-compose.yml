services:
  app:
    image: ghcr.io/baselhusam/daily-hub:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailyhub-app
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/data.db
      DAILYHUB_DATA_DIR: /app/data
      NODE_ENV: production
    ports:
      - "9999:9999"
    volumes:
      - dailyhub_data:/app/data

volumes:
  dailyhub_data:
