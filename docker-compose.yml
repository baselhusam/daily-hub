services:
  app:
    image: baselhusam/daily-hub:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailyhub-app
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/data.db
      DAILYHUB_DATA_DIR: /app/data
      NODE_ENV: production
      # The server decides what "today" is, so it must share your timezone or
      # habits reset at UTC midnight. Set TZ in .env or your shell, e.g. Europe/Berlin.
      TZ: ${TZ:-UTC}
    ports:
      - "9999:9999"
    volumes:
      - dailyhub_data:/app/data

volumes:
  dailyhub_data:
